# Hand-authored source, not a template-generated manifest. Edit this file, then render.
# Keep image, argv, resources, probes and storage synchronized with recipe.yaml and
# config/runtime.yaml. Rendering/drift checks do not establish serving equivalence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm-5-2-fp8-h200-agentic
  labels:
    app.kubernetes.io/name: glm-5-2-fp8-h200-agentic
    app.kubernetes.io/managed-by: inference-playbooks
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: glm-5-2-fp8-h200-agentic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: glm-5-2-fp8-h200-agentic
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vllm
          image: docker.io/vllm/vllm-openai:v0.24.0
          command: ["/bin/bash", "-c", "vllm serve \"$@\"", "--"]
          args:
            - /mnt/models
            - --served-model-name=glm-5.2-fp8
            - --kv-cache-dtype=fp8
            - --max-model-len=131072
            - --enable-prefix-caching
            - --enable-chunked-prefill
            - '--speculative-config={"method":"mtp","num_speculative_tokens":5}'
            - --tool-call-parser=glm47
            - --reasoning-parser=glm45
            - --enable-auto-tool-choice
            - --tensor-parallel-size=8
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: HF_TOKEN
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: "32"
              memory: 512Gi
              nvidia.com/gpu: "8"
            limits:
              memory: 512Gi
              nvidia.com/gpu: "8"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 180
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: hf-cache
              mountPath: /home/nobody/.cache
            - name: tmp
              mountPath: /tmp
            - name: model-weights
              mountPath: /mnt/models
              readOnly: true
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: hf-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: model-weights
          persistentVolumeClaim:
            claimName: glm52-weights
            readOnly: true
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
