# The template mounts /dev/shm only for TP>1. Eight DP ranks in one pod still
# need it for NCCL and inter-process tensors. The HiSparse and offload pools
# are private pinned memory per rank here, not /dev/shm, but they count toward
# the pod memory limit.
# Startup (weight load, DeepGEMM warmup, CUDA-graph capture, pinning 512 GiB
# of host KV) can exceed the template's 30-minute startup probe; allow 60.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm-5-3-dep8-mtp3-hisparse
spec:
  template:
    spec:
      containers:
        - name: vllm
          startupProbe:
            periodSeconds: 30
            failureThreshold: 120
          volumeMounts:
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
