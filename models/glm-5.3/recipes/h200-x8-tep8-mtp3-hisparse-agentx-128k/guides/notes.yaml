schema_version: 1
profile:
  label: GLM-5.3 TP8/EP8 + HiSparse (low latency)
  sub: One aggregated vLLM engine on one eight-H200 node.
  headline: Best per-user interactivity below ~32 concurrent agentic sessions.
  specs:
    - {label: Node scope, source: "recipe.yaml#/deployment/scope"}
    - {label: Tensor parallel, source: "recipe.yaml#/serving/parallelism/tp"}
    - {label: /dev/shm size, source: "config/shm.yaml#/spec/template/spec/volumes/0/emptyDir/sizeLimit"}
decisions:
  - subjects: ["--tensor-parallel-size", "--enable-expert-parallel"]
    why: TP8 attention splits each decode step across all 8 GPUs for lower per-request latency, but replicates MLA KV on every rank (~2.35M GPU KV tokens per node vs ~5.6M for DP8).
  - subjects: ["--attention-config", "--kv-transfer-config", "config/shm.yaml"]
    why: 384 GiB HiSparse + 128 GiB CPU offload = 512 GiB host KV. A single-node TP>1 engine keeps one shared copy of both pools in /dev/shm, so /dev/shm and the memory limit must exceed 512 GiB.
omissions:
  - setting: --all2all-backend
    why_not: The default (allgather_reducescatter) is used; deepep_low_latency overflows DeepEP's RDMA buffer at 8192 batched tokens and deepep_high_throughput cannot be CUDA-graph captured.
quickstart:
  - {step: Prepare, detail: "Create the hf-token Secret; the node needs at least 1.5 TiB of allocatable memory."}
  - {step: Deploy, detail: "Apply manifests/vllm-v0.31.0/deployment.yaml. Weights (~700 GB) download into an emptyDir; use a pre-populated PVC for repeat deployments."}
insights:
  - Gives 10-20% better P90 interactivity than the DP8/EP8 + HiSparse recipe at concurrency 8-16; from 32 up DP8 wins on both axes.
known_issues:
  - issue: GPU KV capacity limits concurrency.
    impact: At ~64 concurrent long-context sessions requests queue for KV space and TTFT collapses.
    mitigation: Use the DP8/EP8 + HiSparse throughput recipe for higher concurrency.
