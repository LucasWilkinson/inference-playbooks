# With TP8 on one node, vLLM v0.31.0 puts the shared HiSparse host pool
# (384 GiB) and the native offload region (128 GiB) in /dev/shm mmaps, so the
# template's 4Gi /dev/shm is far too small. The tmpfs counts toward the pod
# memory limit.
# Startup (weight load, DeepGEMM warmup, CUDA-graph capture, pinning 512 GiB
# of host KV) can exceed the template's 30-minute startup probe; allow 60.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: glm-5-3-tep8-mtp3-hisparse
spec:
  template:
    spec:
      containers:
        - name: vllm
          startupProbe:
            periodSeconds: 30
            failureThreshold: 120
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 640Gi
